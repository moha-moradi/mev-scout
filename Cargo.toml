[workspace]
resolver = "2"
members = ["core", "cli"]

# Keep dev artifacts small: line tables for our crates only, no debuginfo for
# dependencies, and no incremental cache (large due to many feature/test combos).
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
alloy = { version = "2", features = [
    "providers",
    "rpc-types",
    "transport-http",
    "rpc-client",
    "consensus",
    "reqwest-default-tls",
    "signers",
    "signer-local",
    "eips",
    "serde",
] }
rusqlite = { version = "0.31", features = ["bundled"] }

