# mev-scout configuration — public RPCs from chainlist (no API keys needed).
#
# Generated from mev-scout.example.toml with free public endpoints listed on
# chainlist.org / the ethereum-lists/chains registry for every supported chain.
# No `${ENV_VAR}` placeholders require exporting any key; every URL below is a
# public, free-tier HTTPS endpoint.

# Default chain for this example file. Switch to avalanche (or others) as needed.
chain = "avalanche"
priority_fee_gwei = 30

# Global (default) RPC endpoints — used for any chain without a per-chain
# `[chains.<name>.rpc]` override below. These mirror polygon's public set.
rpc_urls = [
  "https://polygon.drpc.org",
  "https://polygon-bor-rpc.publicnode.com",
  "https://polygon.gateway.tenderly.co",
]

# Per-provider RPS limits (matches rpc_urls order).
rpc_rps = [1.0, 1.0, 0.8]

# Global default RPS (used when rpc_rps is not set for a provider). 0 = unlimited.
rps_limit = 1

# Default strategy set (comma-separated or "all")
strategies = "all"

# Backtest gas price model: historical_exact | p90 | fixed | live
gas_model = "historical_exact"

# Default output format: table | csv | json
output = "table"

# ── Per-chain public RPC overrides ─────────────────────────────────
# Switching chains via `--chain` / config just works — every chain gets its
# own public endpoints from chainlist. `rps_limit` / `block_concurrency` stay
# global.

# ── Explorer (realized-MEV forensic layer) ──────────────────────────
# [explorer]
# arb_likely_parity = false
# confirmations = 6

[chains.polygon]
chain_id = 137

[chains.polygon.rpc]
rpc_urls = [
  "https://polygon.drpc.org",
  "https://polygon-bor-rpc.publicnode.com",
  "https://polygon.gateway.tenderly.co",
]
rpc_rps = [1.0, 1.0, 0.8]

