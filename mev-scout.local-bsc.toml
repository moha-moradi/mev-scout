# Local BSC fast-node profile for the 8 vCPU / 16 GB box in
# docs/LOCAL_BSC.md. One chain on that machine.
# Concurrency stays small so geth --cache 4096 and this process fit in 16 GB.
chain = "bsc"
gas_model = "historical_exact"
strategies = "all"
output = "table"

# 0 = unlimited: no rate limiter; local provider weight dominates
# block/log sharding. Public archive peer is failover for those reads
# and first choice for historical eth_call.
rps_limit = 0
block_concurrency = 4
rpc_batch_blocks = 4
batch_rpc = true

[chains.bsc]
chain_id = 56

[chains.bsc.rpc]
# Local geth first (unlimited). publicnode stays as archive eth_call /
# proof fallback; it does not take first-try block/log traffic.
rpc_urls = [
  "http://127.0.0.1:8545",
  "https://bsc-rpc.publicnode.com",
]
rpc_rps = [0.0, 1.0]

[discover]
source = "onchain"
batch_size = 2000
factory_batch_size = 10000
# Fast node keeps 600k blocks of logs (~3 days). A 14-day lookback is not
# on this disk; it would fall through to the public URL.
lookback_days = 2
rpc_concurrency = 4

[live]
# Default 2000; BSC blocks are ~0.75 s.
poll_interval_ms = 250

[explorer]
confirmations = 8
