# Avalanche phase-2 explorer backfill config.
# RPCs probed 2026-10-18 for tip-300k (~7d) eth_getBlockByNumber + eth_getBlockReceipts.
# OnFinality public dropped after live 1h smoke (constant 429 under concurrency).
chain = "avalanche"
gas_model = "historical_exact"
output = "table"
priority_fee_gwei = 30
strategies = "all"
rps_limit = 40
block_concurrency = 32
rpc_rps = [
  20.0, # dwellir archive (keyed)
  15.0, # dwellir archive #2
  10.0, # publicnode
  8.0,  # sentio
  8.0,  # drpc
  3.0,  # simplystaking (strict public limit)
  5.0,  # thirdweb
  5.0,  # pocket
]
