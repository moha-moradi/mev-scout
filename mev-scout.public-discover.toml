# One-off 30-day pool discovery without eth_getLogs (receipts path).
# Public peers reject address-less eth_getLogs; this scans block receipts
# and filters factory logs locally. SMOKE TEST FIRST: discover --blocks 100.
# Keep Dwellir at 1 RPS; higher concurrency creates failed_windows and stops
# the discovery watermark from advancing.
chain = "avalanche"
output = "table"

rps_limit = 0.0
rpc_urls = [
  "https://avalanche-c-chain.publicnode.com",
  "https://api-avalanche-mainnet-archive.n.dwellir.com/${DWELLIR_AVALANCHE_KEY}/ext/bc/C/rpc",
]
rpc_rps = [0.0, 1.0]

[discover]
source = "receipts"
lookback_days = 30
rpc_concurrency = 8
receipt_batch_blocks = 4
receipt_cache_blocks = false
health_check = false
resolve_remote_metadata = false
min_tvl = 0.0
max_pools = 100000
