# Local pruned Bor profile for the 4 vCPU / 16 GB box in
# docs/LOCAL_POLYGON.md. One chain on that machine.
# Concurrency stays small so Heimdall + Bor + this process fit in 16 GB.
chain = "polygon"
gas_model = "historical_exact"
strategies = "all"
output = "table"

# 0 = unlimited: no rate limiter; local provider weight dominates
# block/log sharding. Public archive peer is failover for those reads
# and first choice for historical eth_call.
rps_limit = 0
block_concurrency = 4
rpc_batch_blocks = 4
batch_rpc = true

[chains.polygon]
chain_id = 137

[chains.polygon.rpc]
# Local Bor first (unlimited). publicnode stays as archive eth_call /
# proof fallback; it does not take first-try block/log traffic.
rpc_urls = [
  "http://127.0.0.1:8545",
  "https://polygon-bor-rpc.publicnode.com",
]
rpc_rps = [0.0, 1.0]

[discover]
source = "onchain"
batch_size = 2000
factory_batch_size = 10000
# 30 days of logs only if the pruned snap still has them. Otherwise
# `discover --blocks 2000` and let the public URL cover the rest.
lookback_days = 30
rpc_concurrency = 4

[live]
# Default 2000; Polygon blocks are ~2 s.
poll_interval_ms = 500

[explorer]
confirmations = 4
