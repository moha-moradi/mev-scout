<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>mev-scout · forensic MEV view</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap"/>
<style>
:root {
  --paper: #F7F4EF;
  --raised: #FCFAF7;
  --ink: #1A1A1A;
  --ink-soft: #45423E;
  --muted: #8C867E;
  --rule: #E2DCD2;
  --rule-strong: #C9C1B4;
  --accent: #E84142;
  --wash: #FCEDEC;
  --gain: #3B6E4F;
  --loss: #B3261E;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 28px 72px; }

/* masthead */
.masthead {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 12px 24px; padding: 40px 0 14px; border-bottom: 1px solid var(--ink);
}
.wordmark { font: 600 30px/1 var(--serif); letter-spacing: -.015em; margin: 0; }
.chain { color: var(--ink-soft); font-size: 13px; margin-top: 7px; }
.chain em { font-style: normal; color: var(--accent); }
.mh-meta { font: 400 11px/1.8 var(--mono); color: var(--muted); text-align: right; }
.mh-meta b { color: var(--ink-soft); font-weight: 500; }

/* honesty ribbon */
.ribbon {
  display: flex; flex-wrap: wrap; gap: 3px 22px; margin: 14px 0 0; padding: 10px 14px;
  background: var(--wash); border-left: 2px solid var(--accent); font-size: 12.5px; color: var(--ink-soft);
}
.ribbon b { font-weight: 500; color: var(--loss); }

/* hero */
.hero { padding: 46px 0 30px; }
.kicker {
  font: 500 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
}
.figure { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 20px; margin-top: 12px; }
.amount { font: 600 clamp(46px, 9vw, 78px)/1 var(--serif); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.amount .approx { color: var(--muted); font-weight: 500; }
.amount.neg { color: var(--loss); }
.amount.neg .approx { color: var(--loss); opacity: .55; }
.cov-chip {
  font: 400 11px/1 var(--mono); color: var(--ink-soft); background: var(--raised);
  border: 1px solid var(--rule-strong); padding: 5px 9px; white-space: nowrap;
}
.cov-chip.warn { border-color: var(--accent); color: var(--loss); }
.cov-bar { width: 170px; height: 3px; background: var(--rule); margin-top: 18px; }
.cov-bar i { display: block; height: 100%; background: var(--ink); }
.companions { display: flex; flex-wrap: wrap; gap: 26px 52px; margin-top: 32px; }
.companion .label {
  font: 400 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.companion .value { font: 500 19px/1.3 var(--mono); margin-top: 9px; font-variant-numeric: tabular-nums; }
.companion .sub { font: 400 10px/1.4 var(--mono); color: var(--muted); margin-top: 4px; }
.honest {
  margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--rule);
  font: 400 12px/1.7 var(--mono); color: var(--muted);
}
.honest b { color: var(--ink-soft); font-weight: 500; }

/* filters */
.filters {
  display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
  padding: 13px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
}
.f-label { font: 400 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field { display: flex; align-items: center; gap: 8px; }
input[type=search], select {
  font: 400 12px/1 var(--mono); color: var(--ink); background: transparent; border: 0;
  border-bottom: 1px solid var(--rule-strong); padding: 6px 2px; border-radius: 0;
}
input[type=search]:focus, select:focus { outline: none; border-bottom-color: var(--accent); }
input[type=search] { min-width: 210px; }
.toggle { display: flex; align-items: center; gap: 7px; cursor: pointer; font: 400 12px/1 var(--mono); color: var(--ink-soft); }
.toggle input { accent-color: var(--accent); }

/* blocks */
section.block { padding: 40px 0 0; }
.block h2 {
  font: 500 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 6px;
}
.lede { font: 400 11.5px/1.5 var(--mono); color: var(--muted); margin: 0 0 16px; }
.lede b { color: var(--ink-soft); font-weight: 500; }

/* tables */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: baseline; }
thead th {
  position: sticky; top: 0; background: var(--paper); border-bottom: 1px solid var(--ink);
  font: 400 9.5px/1.6 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
tbody td { font: 400 12.5px/1.5 var(--mono); font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: var(--raised); }
.num { text-align: right; }
.null { color: var(--muted); }
.gain { color: var(--gain); }
.loss { color: var(--loss); }
.hex { color: var(--ink-soft); }
.txlink { text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--rule-strong); }
.txlink:hover, .txlink.active { color: var(--accent); border-bottom-color: var(--accent); }
.kind { font-weight: 500; }
.conf { font-size: 10px; color: var(--muted); margin-left: 6px; }
.conf.exact { color: var(--gain); }
.rank { color: var(--muted); width: 24px; }
.empty td { color: var(--muted); }
#live tbody tr { cursor: pointer; }
#live tbody tr.sel td { background: var(--wash); }
.more {
  margin-top: 14px; font: 400 11px/1 var(--mono); color: var(--ink-soft); background: none;
  border: 1px solid var(--rule-strong); padding: 8px 13px; cursor: pointer;
}
.more:hover { border-color: var(--accent); color: var(--accent); }

/* chart */
.chart svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--muted); font: 400 9px var(--mono); }
svg .axis { stroke: var(--rule-strong); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 12px; font: 400 11px/1 var(--mono); color: var(--muted); }
.legend i { display: inline-block; width: 15px; height: 2px; margin-right: 7px; vertical-align: middle; }
.legend .l-ops { background: var(--ink); }
.legend .l-net { background: var(--accent); }
.legend .l-band { background: var(--rule-strong); width: 4px; height: 9px; }

/* boards */
.boards { display: grid; grid-template-columns: 1fr 1fr; gap: 0 44px; }
.boards > section { min-width: 0; }

/* details drawer */
.details-bar {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px;
  margin-top: 54px; padding-top: 22px; border-top: 1px solid var(--ink);
}
.details-bar h2 { font: 500 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0; }
.details-bar .lede { margin: 0; }
.details-toggle {
  font: 500 12px/1 var(--mono); color: var(--ink); background: none; border: 0;
  border-bottom: 1px solid var(--ink); padding: 3px 0; cursor: pointer; margin-left: auto;
}
.details-toggle:hover { color: var(--accent); border-bottom-color: var(--accent); }
.drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
.drawer > .drawer-inner { overflow: hidden; visibility: hidden; transition: visibility 0s .3s; }
.drawer.open { grid-template-rows: 1fr; }
.drawer.open > .drawer-inner { visibility: visible; transition: visibility 0s 0s; }
.cluster { padding: 28px 0; border-bottom: 1px solid var(--rule); }
.cluster:last-child { border-bottom: 0; }
.cluster h3 { font: 600 16px/1.3 var(--serif); margin: 0 0 4px; }
.cluster h4 { font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
.note { font: 400 11px/1.6 var(--mono); color: var(--muted); margin: 0 0 14px; }
.note b { color: var(--loss); font-weight: 500; }
.attrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0 34px; }
.attr { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.attr .k { font: 400 11px/1.5 var(--mono); color: var(--muted); }
.attr .v { font: 400 11.5px/1.5 var(--mono); text-align: right; word-break: break-all; }
.chip {
  display: inline-block; font: 400 10px/1 var(--mono); border: 1px solid var(--rule-strong);
  padding: 4px 7px; margin: 0 5px 5px 0; color: var(--ink-soft);
}
.chip.off { border-color: var(--accent); color: var(--loss); }

/* drill slide-over */
.backdrop { position: fixed; inset: 0; background: #1A1A1A26; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 15; }
.backdrop.show { opacity: 1; pointer-events: auto; }
.drill {
  position: fixed; top: 0; right: 0; height: 100%; width: min(560px, 92vw); z-index: 20;
  background: var(--raised); border-left: 1px solid var(--ink); box-shadow: -18px 0 40px #1A1A1A14;
  transform: translateX(100%); transition: transform .28s ease; overflow: auto;
}
.drill.show { transform: translateX(0); }
.drill header {
  position: sticky; top: 0; display: flex; align-items: center; gap: 12px; z-index: 1;
  background: var(--raised); padding: 18px 22px 12px; border-bottom: 1px solid var(--ink);
}
.drill .title { font: 600 16px/1.2 var(--serif); }
.drill .close { margin-left: auto; font: 400 12px/1 var(--mono); background: none; border: 0; cursor: pointer; color: var(--muted); }
.drill .close:hover { color: var(--accent); }
.drill .body { padding: 6px 22px 44px; }
.drill dl { display: grid; grid-template-columns: 104px 1fr; gap: 2px 14px; margin: 16px 0; }
.drill dt { font: 400 9.5px/1.9 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.drill dd { margin: 0; font: 400 12px/1.7 var(--mono); word-break: break-all; }
.leg { border-left: 2px solid var(--rule-strong); padding: 5px 0 5px 11px; margin-bottom: 9px; font: 400 11.5px/1.6 var(--mono); }
.leg-registry { border-left-color: var(--accent); }
.leg-transfer { border-left-color: var(--gain); }
pre.raw {
  font: 400 11px/1.6 var(--mono); color: var(--ink-soft); background: var(--paper);
  border: 1px solid var(--rule); padding: 12px; overflow: auto; max-height: 340px;
  white-space: pre-wrap; word-break: break-word;
}
.flow { font: 400 12px/1.7 var(--mono); word-break: break-all; margin: 0; }

/* motion */
@keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
.hero, section.block, .details-bar { animation: rise .5s ease both; }
#activity { animation-delay: .06s; }
#pools { animation-delay: .1s; }
#searchers { animation-delay: .14s; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .hero, section.block, .details-bar { animation: none; }
  .drawer, .drill, .backdrop { transition: none; }
}
@media (max-width: 820px) {
  .wrap { padding: 0 18px 56px; }
  .boards { grid-template-columns: 1fr; gap: 30px 0; }
  .masthead { flex-direction: column; align-items: flex-start; }
  .mh-meta { text-align: left; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead" id="masthead"></header>
  <div id="ribbon-slot"></div>
  <section class="hero" id="hero"></section>
  <div class="filters" id="filters"></div>
  <section class="block" id="live"></section>
  <section class="block" id="activity"></section>
  <div class="boards">
    <section class="block" id="pools"></section>
    <section class="block" id="searchers"></section>
  </div>
  <div class="details-bar">
    <h2>Details</h2>
    <p class="lede">reality · coverage · gaps · quality · kinds · tokens · facets · rejects · jit · oracles · storage</p>
    <button class="details-toggle" id="details-toggle" type="button" aria-expanded="false" aria-controls="drawer">Show</button>
  </div>
  <div class="drawer" id="drawer"><div class="drawer-inner" id="drawer-inner"></div></div>
</div>
<div class="backdrop" id="backdrop"></div>
<aside class="drill" id="drill" aria-hidden="true"></aside>

<script id="snapshot" type="application/json">/*__SNAPSHOT__*/</script>

<script>
(function () {
  var S = JSON.parse(document.getElementById("snapshot").textContent);
  var P = S.panels;
  var K = P.kpi;
  var Q = K.quality;
  var C = S.coverage;
  var T = P.truncation;
  var state = { kind: "", confidence: "", q: "", pricedOnly: false, op: null, limit: 120, details: false };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function cap(s) { s = String(s || ""); return s.charAt(0).toUpperCase() + s.slice(1); }

  /* null is never zero, and every USD figure keeps its approximate marker */
  function usd(v, signed) {
    if (v == null || Number.isNaN(v)) return '<span class="null">&mdash;</span>';
    var a = Math.abs(v);
    var s = a >= 1000 ? a.toLocaleString("en-US", { maximumFractionDigits: 0 })
      : a >= 1 ? a.toFixed(2) : a.toFixed(4);
    var body = "&asymp;$" + s;
    if (!signed) return body;
    return '<span class="' + (v < 0 ? "loss" : "gain") + '">' + (v < 0 ? "&minus;" : "") + body + "</span>";
  }
  function plain(v) { return v == null ? '<span class="null">&mdash;</span>' : esc(v); }
  function cov(priced, total, note) {
    return "priced " + priced + "/" + total + (note ? " · " + note : "");
  }
  function short(addr) {
    var a = String(addr || "");
    return a.length > 14 ? a.slice(0, 8) + "…" + a.slice(-4) : a;
  }
  function fmtTime(ts) {
    if (ts == null) return '<span class="null">&mdash;</span>';
    return new Date(ts * 1000).toISOString().slice(11, 19);
  }
  function fmtDay(ts) {
    if (ts == null) return "";
    return new Date(ts * 1000).toISOString().slice(0, 10);
  }
  function fmtSpan(secs) {
    if (secs == null || Number.isNaN(secs)) return "—";
    if (secs < 60) return secs + "s";
    if (secs < 3600) return (secs / 60).toFixed(secs < 600 ? 1 : 0) + " min";
    if (secs < 86400) return (secs / 3600).toFixed(1) + " h";
    return (secs / 86400).toFixed(1) + " d";
  }
  function relAge(s) {
    if (s < 60) return s + "s ago";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return (s / 3600).toFixed(1) + " h ago";
    return (s / 86400).toFixed(1) + " d ago";
  }

  /* ---------- hash: filters and the open op are both shareable ---------- */
  function parseHash() {
    var h = location.hash || "";
    var m = h.match(/^#\/op\/(0x[a-fA-F0-9]+)/);
    if (m) return { op: m[1].toLowerCase() };
    var params = {};
    h.replace(/^#\/?/, "").split("&").forEach(function (pair) {
      var kv = pair.split("=");
      if (kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || "");
    });
    return params;
  }
  function hashFor(st) {
    if (st.op) return "#/op/" + st.op;
    var parts = [];
    if (st.kind) parts.push("kind=" + encodeURIComponent(st.kind));
    if (st.confidence) parts.push("confidence=" + encodeURIComponent(st.confidence));
    if (st.q) parts.push("q=" + encodeURIComponent(st.q));
    if (st.pricedOnly) parts.push("priced=1");
    return parts.length ? "#/" + parts.join("&") : "#/";
  }
  function syncHash() {
    var want = hashFor(state);
    if (location.hash !== want) location.hash = want;
  }

  /* events carry no label; actors do — join on competitor = COALESCE(contract, eoa) */
  var labels = {};
  (P.actors || []).forEach(function (a) {
    if (!a.label) return;
    labels[String(a.competitor).toLowerCase()] = a.label;
    if (a.eoa) labels[String(a.eoa).toLowerCase()] = a.label;
  });
  function searcherOf(e) {
    var key = String(e.contract || e.eoa || "").toLowerCase();
    return { key: key, label: labels[key] || null };
  }
  function filteredEvents() {
    return (P.events || []).filter(function (e) {
      if (state.kind && e.kind !== state.kind) return false;
      if (state.confidence && e.confidence !== state.confidence) return false;
      if (state.pricedOnly && e.profit_usd == null) return false;
      if (state.q) {
        var q = state.q.toLowerCase();
        var blob = (e.tx_hash + " " + e.eoa + " " + (e.contract || "") + " " + (searcherOf(e).label || "")).toLowerCase();
        if (blob.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function table(headers, rowsHtml) {
    return "<table><thead><tr>" + headers.map(function (h) {
      return "<th" + (h.num ? ' class="num"' : "") + ">" + esc(h.t) + "</th>";
    }).join("") + "</tr></thead><tbody>" + rowsHtml + "</tbody></table>";
  }
  function kv(pairs) {
    return '<div class="attrs">' + pairs.map(function (p) {
      return '<div class="attr"><span class="k">' + esc(p[0]) + '</span><span class="v">' + p[1] + "</span></div>";
    }).join("") + "</div>";
  }

  var span = (C.max_block_ts != null && C.min_block_ts != null)
    ? C.max_block_ts - C.min_block_ts : null;

  /* ---------- static composition ---------- */
  function renderMasthead() {
    var age = Math.max(0, Math.floor(Date.now() / 1000) - (S.generator.generated_at || 0));
    $("masthead").innerHTML =
      '<div><h1 class="wordmark">mev-scout</h1><div class="chain">' +
      esc(S.db.chain_label) + " · C-Chain" +
      (S.db.chain_id != null ? " <em>· " + S.db.chain_id + "</em>" : "") + "</div></div>" +
      '<div class="mh-meta">window <b>' + esc(S.window.label) + "</b><br>" +
      "snapshot <b>" + fmtDay(S.generator.generated_at) + " " + fmtTime(S.generator.generated_at) +
      "</b> UTC · " + relAge(age) + "<br>generator " + esc(S.generator.version) + " · api v" + S.api_version + "</div>";
  }

  function renderRibbon() {
    var notes = [];
    if (S.db.status !== "at_head") {
      notes.push("<b>schema " + S.db.user_version + " / head " + S.db.schema_head + "</b> — " +
        esc(S.db.status) + ". Panels degrade via StoreCaps; this tool never migrated the DB.");
    }
    if (!S.caps.has_excluded_from_net) {
      notes.push("<b>net ungated</b> — no excluded_from_net column, so net is gross minus gas on every op.");
    }
    if (S.truncation && S.truncation.hit_budget) {
      notes.push("<b>truncated</b> — events " + S.truncation.ops_emitted + "/" + S.truncation.ops_total +
        ", evidence " + S.truncation.evidence_emitted + "/" + S.truncation.max_evidence + ".");
    }
    if (span != null && span < 3600) {
      notes.push("indexed wall span is only <b>" + fmtSpan(span) + "</b> — do not read this as multi-day revenue.");
    }
    if (notes.length) {
      $("ribbon-slot").innerHTML = '<div class="ribbon">' +
        notes.map(function (n) { return "<span>" + n + "</span>"; }).join("") + "</div>";
    }
  }

  function renderHero() {
    var neg = K.net_usd < 0;
    var abs = Math.abs(K.net_usd);
    var big = abs.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    var pct = K.ops > 0 ? Math.round((K.net_priced / K.ops) * 100) : 0;
    $("hero").innerHTML =
      '<div class="kicker">Net profit · ' + esc(S.window.label) + " window</div>" +
      '<div class="figure"><div class="amount' + (neg ? " neg" : "") + '">' +
      '<span class="approx">' + (neg ? "&minus;&asymp;$" : "&asymp;$") + "</span>" + big + "</div>" +
      '<span class="cov-chip' + (K.net_priced < K.ops ? " warn" : "") + '">' +
      esc(cov(K.net_priced, K.ops, K.net_gating_available ? "" : "ungated")) + "</span></div>" +
      '<div class="cov-bar" title="' + esc(cov(K.net_priced, K.ops)) + " — " + pct + '% of ops priced"><i style="width:' + pct + '%"></i></div>' +
      '<div class="companions">' +
      companion("ops", String(K.ops), K.searchers + " searchers · " + K.competitors + " competitors") +
      companion("gross", usd(K.gross_usd), cov(K.gross_priced, K.ops)) +
      companion("gas", usd(K.gas_usd), cov(K.gas_priced, K.ops)) +
      "</div>" +
      '<p class="honest">Window <b>' + esc(S.window.label) + "</b> covers <b>" + fmtSpan(span) +
      "</b> of indexed chain time · " + fmtDay(C.min_block_ts) + " " + fmtTime(C.min_block_ts) +
      " &rarr; " + fmtTime(C.max_block_ts) + " UTC · head <b>" + plain(C.head) +
      "</b>, indexed to " + plain(C.indexed_to) + " · largest single op " + usd(K.highest_single_usd) +
      ".<br>" + esc(cap(S.semantics.usd_columns_are)) + ". " + esc(cap(S.semantics.null_usd_means)) + ".</p>";
  }
  function companion(label, value, sub) {
    return '<div class="companion"><div class="label">' + esc(label) + '</div><div class="value">' +
      value + "</div>" + (sub ? '<div class="sub">' + esc(sub) + "</div>" : "") + "</div>";

  function renderFilters() {
    $("filters").innerHTML =
      '<span class="field"><span class="f-label" id="lKind">kind</span><select id="fKind" aria-labelledby="lKind">' +
      '<option value="">all</option></select></span>' +
      '<span class="field"><span class="f-label" id="lConf">confidence</span><select id="fConf" aria-labelledby="lConf">' +
      '<option value="">all</option><option value="exact">exact</option><option value="inferred">inferred</option></select></span>' +
      '<label class="toggle"><input type="checkbox" id="fPriced"/> priced only</label>' +
      '<input type="search" id="fQ" placeholder="search tx / eoa / contract / label" aria-label="search"/>';
    var kinds = {};
    (P.events || []).forEach(function (e) { kinds[e.kind] = 1; });
    Object.keys(kinds).sort().forEach(function (k) {
      var o = document.createElement("option");
      o.value = k; o.textContent = k;
      $("fKind").appendChild(o);
    });
    syncFilters();
    $("fKind").onchange = function () { state.kind = this.value; afterFilter(); };
    $("fConf").onchange = function () { state.confidence = this.value; afterFilter(); };
    $("fPriced").onchange = function () { state.pricedOnly = this.checked; afterFilter(); };
    $("fQ").oninput = function () { state.q = this.value.trim(); afterFilter(); };
  }
  function syncFilters() {
    $("fKind").value = state.kind;
    $("fConf").value = state.confidence;
    $("fPriced").checked = state.pricedOnly;
    $("fQ").value = state.q;
  }
  function afterFilter() {
    state.op = null;
    state.limit = 120;
    renderLive();
    renderDrill();
    syncHash();
  }

  /* ---------- live feed ---------- */
  function renderLive() {
    var all = filteredEvents().slice().sort(function (a, b) {
      return b.ts - a.ts || b.block_number - a.block_number;
    });
    var rows = all.slice(0, state.limit);
    var body = "";
    rows.forEach(function (e) {
      var s = searcherOf(e);
      var sel = state.op === String(e.tx_hash).toLowerCase();
      body += '<tr class="' + (sel ? "sel" : "") + '" data-op="' + esc(e.tx_hash) + '">' +
        "<td>" + fmtTime(e.ts) + "</td>" +
        '<td class="num">' + e.block_number + "</td>" +
        '<td><span class="kind">' + esc(e.kind) + (e.subkind ? "/" + esc(e.subkind) : "") + "</span>" +
        '<span class="conf ' + esc(e.confidence) + '">' + esc(e.confidence) + "</span></td>" +
        '<td><a class="txlink' + (sel ? " active" : "") + '" href="#/op/' + esc(e.tx_hash) + '">' +
        esc(short(e.tx_hash)) + "</a></td>" +
        "<td>" + (s.label ? esc(s.label) : '<span class="null">unlabelled</span>') +
        '<br><span class="hex">' + esc(short(s.key)) + "</span></td>" +
        '<td class="num">' + usd(e.profit_usd, true) + "</td>" +
        '<td class="num">' + usd(e.net_profit_usd, true) + "</td></tr>";
    });
    $("live").innerHTML =
      "<h2>MEV live</h2>" +
      '<p class="lede">newest first · showing <b>' + rows.length + "</b> of <b>" + all.length +
      "</b> matching · " + T.ops_emitted + " of " + T.ops_total + " ops carried into this file</p>" +
      table([{ t: "time utc" }, { t: "block", num: 1 }, { t: "kind" }, { t: "tx" },
             { t: "searcher" }, { t: "gross", num: 1 }, { t: "net", num: 1 }],
        body || '<tr class="empty"><td colspan="7">no ops match these filters</td></tr>');
    if (all.length > rows.length) {
      var btn = document.createElement("button");
      btn.className = "more";
      btn.type = "button";
      btn.textContent = "show " + Math.min(state.limit, all.length - rows.length) + " more";
      btn.onclick = function () { state.limit *= 2; renderLive(); };
      $("live").appendChild(btn);
    }
    Array.prototype.forEach.call($("live").querySelectorAll("tbody tr[data-op]"), function (tr) {
      tr.onclick = function (ev) {
        if (ev.target.tagName === "A") return;
        location.hash = "#/op/" + tr.getAttribute("data-op");
      };
    });
  }

  /* ---------- activity ---------- */
  function linePath(pts, x0, y0, w, h, ymin, ymax) {
    if (!pts.length) return "";
    var n = pts.length;
    return pts.map(function (p, i) {
      var x = x0 + (n === 1 ? w / 2 : (i / (n - 1)) * w);
      var t = ymax === ymin ? 0.5 : (p - ymin) / (ymax - ymin);
      var y = y0 + h - t * h;
      return (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
  }

  function renderActivity() {
    var series = P.series || [];
    var W = 1000, H = 210, pad = 40, top = 14, plotH = H - 56;
    var ops = series.map(function (s) { return s.ops; });
    var nets = series.map(function (s) { return s.net_usd; });
    var maxOps = Math.max(1, Math.max.apply(null, ops.concat([1])));
    var minNet = Math.min.apply(null, nets.concat([0]));
    var maxNet = Math.max.apply(null, nets.concat([0]));
    var bars = "", dots = "";
    series.forEach(function (s, i) {
      var n = series.length;
      var x = pad + (n === 1 ? (W - pad * 2) / 2 : (i / (n - 1)) * (W - pad * 2));
      var bh = s.blocks_indexed ? Math.min(15, 2 + s.blocks_indexed / 8) : 0;
      if (bh) {
        bars += '<rect x="' + (x - 1.6).toFixed(1) + '" y="' + (H - 28 - bh).toFixed(1) +
          '" width="3.2" height="' + bh.toFixed(1) + '" fill="#C9C1B4"><title>block ' + s.bucket_start +
          " · " + s.blocks_indexed + " indexed</title></rect>";
      }
      if (s.ops) {
        var oy = top + plotH - (s.ops / maxOps) * plotH;
        dots += '<circle cx="' + x.toFixed(1) + '" cy="' + oy.toFixed(1) +
          '" r="2.1" fill="#1A1A1A"><title>' + fmtTime(s.bucket_start) + " UTC · " + s.ops +
          " ops · net &asymp;$" + s.net_usd.toFixed(2) + "</title></circle>";
      }
    });
    var pathOps = linePath(ops, pad, top, W - pad * 2, plotH, 0, maxOps);
    var pathNet = linePath(nets, pad, top, W - pad * 2, plotH, minNet, maxNet === minNet ? minNet + 1 : maxNet);
    $("activity").innerHTML =
      "<h2>Activity</h2>" +
      '<p class="lede">bucket <b>' + P.bucket_secs + "s</b> · ops against net usd · band = blocks indexed</p>" +
      '<div class="chart"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="ops and net over time">' +
      '<line class="axis" x1="' + pad + '" y1="' + (H - 28) + '" x2="' + (W - pad) + '" y2="' + (H - 28) + '"/>' +
      bars +
      '<path d="' + pathNet + '" fill="none" stroke="#E84142" stroke-width="1.6"/>' +
      '<path d="' + pathOps + '" fill="none" stroke="#1A1A1A" stroke-width="1.6"/>' +
      dots +
      '<text x="' + pad + '" y="' + (H - 12) + '">' + fmtTime(series.length ? series[0].bucket_start : null) + "</text>" +
      '<text x="' + (W - pad) + '" y="' + (H - 12) + '" text-anchor="end">' +
      fmtTime(series.length ? series[series.length - 1].bucket_start : null) + "</text>" +
      '<text x="' + (pad - 7) + '" y="' + (top + 3) + '" text-anchor="end">' + maxOps + "</text>" +
      '<text x="' + (pad - 7) + '" y="' + (top + plotH) + '" text-anchor="end">0</text>' +
      "</svg></div>" +
      '<div class="legend"><span><i class="l-ops"></i>ops per bucket (peak ' + maxOps + ")</span>" +
      '<span><i class="l-net"></i>net &asymp;$' + minNet.toFixed(2) + " … &asymp;$" + maxNet.toFixed(2) + "</span>" +
      '<span><i class="l-band"></i>blocks indexed</span></div>';
  }

  /* ---------- boards ---------- */
  function byNetDesc(list) {

  /* ---------- details drawer ---------- */

    var r = S.rejects || { ladder: [], total: 0, recording_empty: true, note: "" };

    parts.push(cluster("Kind × subkind × confidence",

        '</td><td class="num">' + usd(t.net_usd, true) + '</td><td class="num">' + t.priced_ops + "/" + t.ops + "</td></tr>";
    });
    parts.push(cluster("Profit tokens", "Grouped by profit_token.",
      table([{ t: "token" }, { t: "ops", num: 1 }, { t: "gross", num: 1 }, { t: "net", num: 1 }, { t: "priced", num: 1 }],
        tokenRows || '<tr class="empty"><td colspan="5">none</td></tr>')));

    parts.push(cluster("Facets",

      "<h4>tags</h4>" + facetTable(P.tag_facets) + "<h4>reasons</h4>" + facetTable(P.reason_facets)));

    parts.push(cluster("Storage health",
      "Dead or unpopulated on the logs-only path: blocks.producer, swaps.dex, swaps.sender, transfers.is_native.",
      table([{ t: "table" }, { t: "rows", num: 1 }], storeRows || '<tr class="empty"><td colspan="2">none</td></tr>') +
        "<h4>store capabilities probed on this file</h4>" + capChips));

    $("drawer-inner").innerHTML = parts.join("");

  /* ---------- drill-down slide-over ---------- */
  function renderDrill() {
    var drill = $("drill");
    if (!state.op) {
      drill.className = "drill";
      drill.setAttribute("aria-hidden", "true");
      drill.innerHTML = "";
      $("backdrop").className = "backdrop";
      return;
    }
    $("backdrop").className = "backdrop show";
    drill.className = "drill show";
    drill.setAttribute("aria-hidden", "false");
    var ev = null;
    (P.evidence || []).forEach(function (e) {
      if (!ev && String(e.tx_hash).toLowerCase() === state.op) ev = e;
    });
    if (!ev) {
      drill.innerHTML = '<header><span class="title">Op</span>' +
        '<button class="close" type="button" id="drill-close">Close</button></header>' +
        '<div class="body"><p class="note">No evidence blob for ' + esc(state.op) +
        " — it fell outside the evidence budget (see truncation above).</p></div>";
    } else {
      var legs = (ev.route || []).map(function (leg) {
        return '<div class="leg leg-' + esc(leg.token_source || "unknown") + '">' +
          esc(leg.pool || "?") + " · " + esc(leg.amm || "?") + "<br>" +
          esc(leg.token_in || "?") + " &rarr; " + esc(leg.token_out || "?") +
          '<br><span class="null">source: ' + esc(leg.token_source || "?") + "</span></div>";
      }).join("") || '<p class="note">no route legs recorded</p>';
      var chips = function (list) {
        var out = (list || []).map(function (t) {
          return '<span class="chip">' + esc(t) + "</span>";
        }).join("");
        return out || '<span class="null">&mdash;</span>';
      };
      drill.innerHTML = '<header><span class="title">' + esc(ev.kind) +
        (ev.subkind ? "/" + esc(ev.subkind) : "") + "</span>" +
        '<button class="close" type="button" id="drill-close">Close</button></header><div class="body"><dl>' +
        "<dt>tx</dt><dd>" + esc(ev.tx_hash) + "</dd>" +
        "<dt>block</dt><dd>" + ev.block_number + "</dd>" +
        "<dt>confidence</dt><dd>" + esc(ev.confidence) + "</dd>" +
        "<dt>detector</dt><dd>" + esc(ev.detector) + "</dd>" +
        "<dt>searcher</dt><dd>" + esc(labels[String(ev.contract || ev.eoa || "").toLowerCase()] || "unlabelled") +
        "<br>" + esc(short(ev.eoa)) + " / " + esc(short(ev.contract || "")) + "</dd>" +
        "<dt>gross</dt><dd>" + usd(ev.profit_usd, true) + "</dd>" +
        "<dt>net</dt><dd>" + usd(ev.net_profit_usd, true) + "</dd>" +
        "<dt>gas</dt><dd>" + usd(ev.gas_cost_usd) + "</dd>" +
        "<dt>volume</dt><dd>" + usd(ev.volume_usd) + "</dd>" +
        "<dt>flash fee</dt><dd>" + usd(ev.flashloan_fee_usd) + "</dd>" +
        "<dt>excluded</dt><dd>" + (ev.excluded_from_net ? "yes — kept out of net" : "no") + "</dd>" +
        "<dt>pnl basis</dt><dd>" + plain(ev.pnl_basis) + "</dd>" +
        "<dt>amount</dt><dd>" + plain(ev.profit_amount) +
        (ev.profit_amount_human
          ? "<br>≈ " + esc(ev.profit_amount_human) + " " + esc(short(ev.profit_token || ""))
          : '<br><span class="null">raw only (decimals unknown)</span>') + "</dd></dl>" +
        "<h4>Route</h4>" + legs +
        "<h4>Tags</h4><p class=\"flow\">" + chips(ev.tags) + "</p>" +
        "<h4>Reasons</h4><p class=\"flow\">" + chips(ev.reasons) + "</p>" +
        "<h4>Victims</h4><p class=\"flow\">" +
        ((ev.victim_hashes || []).length ? esc(ev.victim_hashes.join(", ")) : '<span class="null">&mdash;</span>') + "</p>" +
        "<h4>Raw details</h4><pre class=\"raw\">" + esc(JSON.stringify(ev.details, null, 2)) + "</pre></div>";
    }
    var close = $("drill-close");
    if (close) close.onclick = function () { location.hash = "#/"; };
  }

  $("details-toggle").onclick = function () {
    state.details = !state.details;
    renderDetailsBar();
  };
  $("backdrop").onclick = function () { location.hash = "#/"; };
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && state.op) location.hash = "#/";
  });

  renderMasthead();
  renderRibbon();
  renderHero();
  renderFilters();
  renderActivity();
  renderPools();
  renderSearchers();
  renderDetails();
  renderDetailsBar();

  var h0 = parseHash();
  if (h0.op) {
    state.op = h0.op;
  } else {
    if (h0.kind) state.kind = h0.kind;
    if (h0.confidence) state.confidence = h0.confidence;
    if (h0.q) state.q = h0.q;
    if (h0.priced === "1") state.pricedOnly = true;
    syncFilters();
  }
  renderLive();
  renderDrill();

  window.addEventListener("hashchange", function () {
    var h = parseHash();
    if (h.op) {
      if (state.op === h.op) return;
      state.op = h.op;
    } else {
      state.op = null;
      state.kind = h.kind || "";
      state.confidence = h.confidence || "";
      state.q = h.q || "";
      state.pricedOnly = h.priced === "1";
      syncFilters();
    }
    renderLive();
    renderDrill();
  });
})();
</script>
</body>
</html>
