[package]
name = "mev-scout-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# Data ingestion & caching
alloy = { version = "2", features = [
    "providers",
    "rpc-types",
    "transport-http",
    "rpc-client",
    "consensus",
    "reqwest-default-tls",
    "signers",
    "eips",
] }
rusqlite = { version = "0.31", features = ["bundled"] }
bincode = "1"
futures = "0.3"
url = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }

# Enum utilities
strum = { version = "0.26", features = ["derive"] }

# EVM state replay
revm = "40.0.3"
reqwest = { version = "0.13", features = ["json", "gzip"] }

# Signature resolution
hex = "0.4"
ruzstd = "0.7"

[dev-dependencies]
wiremock = "0.6"
