# Local AvalancheGo profile for the 4 vCPU / 16 GB box in
# docs/LOCAL_AVALANCHE.md. One chain on that machine.
# Concurrency stays small so the node and this process fit in 16 GB.
# Raise block_concurrency / rpc_concurrency only when `free -h` shows idle RAM.
chain = "avalanche"
gas_model = "historical_exact"
strategies = "all"
output = "table"

# 0 = unlimited: no rate limiter, and this provider's weight dominates
# block/log sharding. The public archive peer is failover for those reads
# and the first choice for historical eth_call.
rps_limit = 0
# In-flight blocks for explorer backfill and backtest fetch.
block_concurrency = 4
# Blocks packed into one eth_getBlockByNumber + eth_getBlockReceipts POST.
# Public configs leave this unset (default 1 = one block per POST).
rpc_batch_blocks = 4
# Also enables the backtest fetcher's batched block+receipt POST.
# AvalancheGo allows up to 1000 requests per batch.
batch_rpc = true

[chains.avalanche]
chain_id = 43114

[chains.avalanche.rpc]
# Local node first (unlimited). Block, receipt, and eth_getLogs reads prefer
# it. publicnode stays in the list as the archive eth_call fallback (sAVAX
# rate, proofs); it does not take first-try block/log traffic.
rpc_urls = [
  "http://127.0.0.1:9650/ext/bc/C/rpc",
  "https://avalanche-c-chain.publicnode.com",
]
rpc_rps = [0.0, 1.0]

[discover]
source = "onchain"
# Activity eth_getLogs window. Factory creation logs use a coarser window.
batch_size = 2000
factory_batch_size = 10000
# Default discover window when no --days / --from-block is passed.
# A month of C-Chain is ~1.3M blocks. A fresh state-sync node does not have
# that history — use `discover --blocks 2000` until it does. Ignored when
# unset (public profile keeps chains.toml's 1000-block lookback).
lookback_days = 30
# Concurrent activity windows on the unlimited node. Rate-limited shards stay serial.
rpc_concurrency = 4

[live]
# Default 2000; C-Chain blocks are ~2 s.
poll_interval_ms = 500

[explorer]
confirmations = 4
