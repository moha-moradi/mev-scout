# Ephemeral public-RPC profile for explorer tag-coverage runs.
# Local AvalancheGo is preferred when up; this file is for when it is not.
chain = "avalanche"
gas_model = "historical_exact"
strategies = "all"
output = "table"
rps_limit = 5
block_concurrency = 4
rpc_batch_blocks = 1
batch_rpc = false

[chains.avalanche]
chain_id = 43114

[chains.avalanche.rpc]
rpc_urls = [
  "https://avalanche-c-chain.publicnode.com",
]
rpc_rps = [5.0]

[discover]
source = "onchain"
batch_size = 2000

[explorer]
confirmations = 4
poll_interval_ms = 2000
