# Explorer index backfill through the local Avalanche node.
# Block + receipts are batched locally; no eth_getLogs and no public peer
# traffic for logs. Start with a small --from-block/--to-block range.
chain = "avalanche"
output = "table"

rps_limit = 0.0
block_concurrency = 4
rpc_batch_blocks = 4
batch_rpc = true

rpc_urls = [
  "${AVAX_RPC_URL}",
  "https://api-avalanche-mainnet-archive.n.dwellir.com/${DWELLIR_AVALANCHE_KEY}/ext/bc/C/rpc",
]
rpc_rps = [0.0, 1.0]

[explorer]
confirmations = 4
